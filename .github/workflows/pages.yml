name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build first presentation
        run: >
          pnpm exec slidev build
          cpp-performance/presentations/performance-cpp-1/slides.md
          --out ../../../dist/performance-cpp-1
          --base /${{ github.event.repository.name }}/
      - name: Build second presentation
        run: >
          pnpm exec slidev build
          cpp-performance/presentations/performance-cpp-2/slides.md
          --out ../../../dist/performance-cpp-1/performance-cpp-2
          --base /${{ github.event.repository.name }}/performance-cpp-2/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/performance-cpp-1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
